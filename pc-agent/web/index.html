<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYD Deck</title>
<style>
:root {
  --bg: #0e0f12; --panel: #17181c; --panel2: #1f2026; --line: #2c2d35; --line2: #3a3b45;
  --text: #f2f2f5; --text2: #a3a3ad; --muted: #6b6b75; --accent: #5aa2ff; --accent-bg: #1c2b44;
  --green: #3dd27a; --orange: #ffb02e; --red: #ff5a52; --radius: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: #55565f; }
button.primary { background: var(--accent); border-color: var(--accent); color: #06121f; font-weight: 600; }
button.primary:disabled { opacity: .5; cursor: default; }
button.ghost { background: transparent; border-color: transparent; color: var(--text2); }
button.ghost:hover { color: var(--text); background: var(--panel2); }
button.danger { color: var(--red); }
input[type=text], input:not([type]), select, textarea { background: var(--bg); border: 1px solid var(--line2);
  border-radius: 8px; padding: 6px 9px; width: 100%; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
input[type=color] { width: 36px; height: 30px; padding: 0; border: 1px solid var(--line2); border-radius: 8px; background: none; }
label.field { display: block; margin: 12px 0 4px; color: var(--text2); font-size: 12.5px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
.pill { font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--panel2); color: var(--text2); white-space: nowrap; }
.pill.ok { color: var(--green); } .pill.warn { color: var(--orange); }
.spacer { flex: 1; }
.dirty { color: var(--orange); font-size: 12.5px; }
main { display: grid; grid-template-columns: 220px 1fr 380px; min-height: 0; }
aside, .editor { background: var(--panel); overflow: auto; min-height: 0; }
aside { border-right: 1px solid var(--line); padding: 14px 12px; }
.editor { border-left: 1px solid var(--line); padding: 14px 16px 40px; }
.section-title { font-size: 12px; text-transform: none; color: var(--muted); margin: 14px 0 6px; letter-spacing: .02em; }
.pages { display: flex; flex-direction: column; gap: 2px; }
.page { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 8px; cursor: pointer; color: var(--text2); }
.page:hover { background: var(--panel2); }
.page.on { background: var(--accent-bg); color: var(--text); }
.page .ico { font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets"; font-size: 14px; width: 16px; }
.page.child { padding-left: 26px; }
.center { overflow: auto; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.device { background: #000; border-radius: 14px; padding: 9px; border: 1px solid var(--line2); zoom: var(--z, 1); }
@media (max-width: 1100px) { main { grid-template-columns: 190px 1fr 330px; } }
.screen { width: 480px; height: 360px; position: relative; }
.key { position: absolute; width: 108px; height: 108px; border-radius: 18px; background: #212125; cursor: pointer;
  overflow: hidden; border: 2px solid transparent; transition: transform .12s; }
.key img { width: 100%; height: 100%; display: block; image-rendering: auto; }
.key .t { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 15px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 5px; pointer-events: none; }
.key.empty { background: #141416; }
.key.sel { border-color: var(--accent); }
.key.drop { transform: scale(.94); border-color: var(--green); }
.key .back { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: "Segoe Fluent Icons"; font-size: 40px; color: #9a9aa2; padding-bottom: 20px; }
.bar { position: absolute; left: 10px; top: 252px; width: 459px; height: 99px; border-radius: 18px; background: #18181b;
  display: flex; align-items: center; padding: 0 16px; gap: 14px; color: var(--text2); font-size: 13px; }
.bar .clock { font-size: 34px; font-weight: 800; color: var(--text); }
.bar .dots { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; justify-content: center; gap: 7px; }
.bar .dots i { width: 6px; height: 6px; border-radius: 3px; background: #5a5a62; }
.bar .dots i.on { background: var(--text); }
.hint { color: var(--muted); font-size: 12.5px; text-align: center; max-width: 500px; }
.seg { display: flex; background: var(--bg); border: 1px solid var(--line2); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 5px 6px; border-radius: 7px; color: var(--text2); font-size: 13px; }
.seg button.on { background: var(--panel2); color: var(--text); box-shadow: 0 0 0 1px var(--line2) inset; }
.glyphs { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; max-height: 172px; overflow: auto;
  margin-top: 6px; padding: 2px; }
.glyphs button { font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets"; font-size: 18px; padding: 6px 0; border-radius: 7px; }
.glyphs button.on { border-color: var(--accent); background: var(--accent-bg); }
.swatches { display: flex; gap: 5px; flex-wrap: wrap; }
.swatches button { width: 22px; height: 22px; padding: 0; border-radius: 6px; border: 1px solid var(--line2); }
.box { border: 1px solid var(--line); border-radius: var(--radius); padding: 2px 12px 12px; margin-top: 12px; background: var(--panel); }
.box > .head { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
.box > .head b { font-weight: 600; font-size: 13.5px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.presets button { font-size: 12.5px; padding: 4px 9px; }
.check { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; cursor: pointer; }
.check input { margin-top: 3px; }
.note { font-size: 12.5px; color: var(--text2); margin-top: 6px; }
.note.warn { color: var(--orange); }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #26272e; border: 1px solid var(--line2);
  padding: 9px 16px; border-radius: 10px; max-width: 80%; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.empty-editor { color: var(--muted); margin-top: 40px; text-align: center; }
.mini { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>CYD Deck</h1>
    <span id="link" class="pill">Đang tải…</span>
    <span id="sync" class="mini"></span>
    <span class="spacer"></span>
    <span id="dirty" class="dirty"></span>
    <button class="ghost" id="openFolder" title="Mở thư mục chứa deck.json và ảnh">Thư mục dữ liệu</button>
    <button class="primary" id="save">Lưu và gửi xuống bo</button>
  </header>
  <main>
    <aside>
      <label class="field" style="margin-top:0">Tên hồ sơ</label>
      <input id="profileName" maxlength="40">
      <div class="section-title">Trang</div>
      <div class="pages" id="pages"></div>
      <div class="row" style="margin-top:8px">
        <button id="addPage" class="grow">+ Trang</button>
      </div>
      <div id="pageEdit"></div>
    </aside>
    <section class="center">
      <div class="device"><div class="screen" id="screen"></div></div>
      <div class="hint">Bấm vào phím để sửa. Kéo một phím thả lên phím khác để đổi chỗ. Hình xem trước là đúng ảnh sẽ lên bo
        (đã đổi sang màu 16 bit của màn).</div>
      <div class="mini" id="lastPress"></div>
    </section>
    <section class="editor" id="editor"><div class="empty-editor">Chọn một phím để sửa</div></section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const glyphChar = (code) => String.fromCharCode(parseInt(code || 'E700', 16));

let cfg = null, glyphs = [], page = 0, sel = -1, dirty = false, saving = false;
const previews = new Map();  // khoá ảnh → data URL

async function api(path, body, method) {
  const res = await fetch(path, {
    method: method || (body === undefined ? 'GET' : 'POST'),
    headers: {'X-Deck-Token': TOKEN, 'Content-Type': 'application/json'},
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({ok: false, message: 'Agent trả lời lạ (' + res.status + ')'}));
  if (!res.ok) throw new Error(data.message || ('Lỗi ' + res.status));
  return data;
}

function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 4200);
}

function markDirty() {
  dirty = true;
  $('dirty').textContent = 'Chưa lưu';
}

// ---------- dữ liệu ----------

const blankAction = () => ({Type: 'none', Path: '', Args: '', Dir: '', Admin: false, Target: '', Keys: '', Text: '', Cmd: ''});
const blankIcon = () => ({Type: 'none', Glyph: 'E700', Path: '', Bg: '#2B2C33', Fg: '#FFFFFF'});
const blankKey = () => ({Kind: 'empty', Title: '', TitleOn: '', Icon: blankIcon(), IconOn: null, Action: blankAction(),
                         Hold: blankAction(), Target: 0, Live: ''});

function fix(key) {
  key.Icon = Object.assign(blankIcon(), key.Icon || {});
  key.Action = Object.assign(blankAction(), key.Action || {});
  key.Hold = Object.assign(blankAction(), key.Hold || {});
  if (key.IconOn) key.IconOn = Object.assign(blankIcon(), key.IconOn);
  return key;
}

async function load() {
  const s = await api('/api/state');
  cfg = s.config;
  cfg.Pages.forEach((p) => p.Keys.forEach(fix));
  glyphs = s.glyphs || [];
  showStatus(s);
  // #p=2&k=1: mở sẵn trang 3, phím 2 (liên kết thẳng tới một phím, ảnh chụp cho README)
  const hash = new URLSearchParams(location.hash.slice(1));
  const p = parseInt(hash.get('p'), 10), k = parseInt(hash.get('k'), 10);
  if (p >= 0 && p < cfg.Pages.length) page = p;
  if (k >= 0 && k < 8) sel = k;
  renderAll();
  if (hash.get('scroll') === 'action') {
    const ed = $('editor');
    const box = [...ed.querySelectorAll('.box')].find((b) => b.textContent.includes('Lệnh khi chạm'));
    if (box) ed.scrollTop = box.offsetTop - 140;
  }
}

function showStatus(s) {
  const link = $('link');
  link.textContent = s.connected ? 'Bo đã nối (' + s.port + ')' : (s.linkStatus || 'Chưa nối bo');
  link.className = 'pill ' + (s.connected ? 'ok' : 'warn');
  $('sync').textContent = s.connected ? s.status : '';
  $('lastPress').textContent = s.lastPress ? 'Lần bấm gần nhất: ' + s.lastPress : '';
}

setInterval(async () => {
  try { showStatus(await api('/api/state')); } catch (e) { $('link').textContent = 'Mất nối với agent'; }
}, 2000);

// ---------- xem trước ----------

function imageKey(icon, title, folder) {
  return JSON.stringify([icon, !!title, !!folder]);
}

async function preview(icon, title, folder) {
  if (!icon || icon.Type === 'none') return '';
  const k = imageKey(icon, title, folder);
  if (previews.has(k)) return previews.get(k);
  try {
    const r = await api('/api/render', {Icon: icon, Title: !!title, Folder: !!folder});
    previews.set(k, r.png);
    return r.png;
  } catch (e) {
    previews.set(k, '');
    return '';
  }
}

// ---------- trang ----------

function topPages() { return cfg.Pages.map((p, i) => i).filter((i) => cfg.Pages[i].Parent < 0); }

function renderPages() {
  const list = $('pages');
  list.innerHTML = '';
  const add = (i, depth) => {
    const p = cfg.Pages[i];
    const el = document.createElement('div');
    el.className = 'page' + (i === page ? ' on' : '') + (depth ? ' child' : '');
    el.innerHTML = '<span class="ico">' + (p.Parent >= 0 ? '&#xE8B7;' : '&#xE80A;') + '</span><span>' + esc(p.Name) + '</span>';
    el.onclick = () => { page = i; sel = -1; renderAll(); };
    list.appendChild(el);
    cfg.Pages.forEach((c, j) => { if (c.Parent === i) add(j, depth + 1); });
  };
  topPages().forEach((i) => add(i, 0));

  const p = cfg.Pages[page];
  const folder = p.Parent >= 0;
  $('pageEdit').innerHTML =
    '<div class="section-title">' + (folder ? 'Thư mục đang chọn' : 'Trang đang chọn') + '</div>' +
    '<input id="pageName" maxlength="23" value="' + esc(p.Name) + '">' +
    '<label class="field">Thanh tin ở dưới</label>' +
    '<select id="pageBar"><option value="info">Giờ, nhạc, CPU/RAM</option><option value="obs">OBS (đang ghi, cảnh)</option></select>' +
    '<div class="row" style="margin-top:10px">' +
    (folder ? '' : '<button id="pageUp" title="Đưa lên trước">↑</button><button id="pageDown" title="Đưa xuống sau">↓</button>') +
    '<span class="spacer"></span><button class="danger" id="pageDel">Xoá</button></div>';
  $('pageName').oninput = (e) => { p.Name = e.target.value; markDirty(); renderPagesSoon(); };
  $('pageBar').value = p.Bar || 'info';
  $('pageBar').onchange = (e) => { p.Bar = e.target.value; markDirty(); };
  $('pageDel').onclick = () => deletePage(page);
  if (!folder) {
    $('pageUp').onclick = () => movePage(page, -1);
    $('pageDown').onclick = () => movePage(page, 1);
  }
}
let pagesTimer = 0;
function renderPagesSoon() { clearTimeout(pagesTimer); pagesTimer = setTimeout(renderPages, 400); }

// Đổi chỗ hai trang trong mảng: sửa lại mọi chỉ số trỏ tới chúng (trang cha, đích của phím thư mục)
function swapPages(a, b) {
  const map = (i) => (i === a ? b : i === b ? a : i);
  [cfg.Pages[a], cfg.Pages[b]] = [cfg.Pages[b], cfg.Pages[a]];
  cfg.Pages.forEach((p) => {
    if (p.Parent >= 0) p.Parent = map(p.Parent);
    p.Keys.forEach((k) => { if (k.Kind === 'folder') k.Target = map(k.Target); });
  });
}

function movePage(i, step) {
  const tops = topPages();
  const at = tops.indexOf(i), to = at + step;
  if (at < 0 || to < 0 || to >= tops.length) return;
  swapPages(i, tops[to]);
  page = tops[to];
  markDirty();
  renderAll();
}

function deletePage(i) {
  if (topPages().length <= 1 && cfg.Pages[i].Parent < 0) { toast('Cần ít nhất một trang'); return; }
  const doomed = new Set([i]);
  let grew = true;
  while (grew) {  // xoá cả thư mục con
    grew = false;
    cfg.Pages.forEach((p, j) => { if (!doomed.has(j) && doomed.has(p.Parent)) { doomed.add(j); grew = true; } });
  }
  if (!confirm('Xoá "' + cfg.Pages[i].Name + '"' + (doomed.size > 1 ? ' và ' + (doomed.size - 1) + ' thư mục bên trong' : '') + '?')) return;
  const keep = cfg.Pages.map((p, j) => j).filter((j) => !doomed.has(j));
  const map = new Map(keep.map((old, now) => [old, now]));
  cfg.Pages = keep.map((j) => cfg.Pages[j]);
  cfg.Pages.forEach((p) => {
    p.Parent = p.Parent >= 0 ? (map.has(p.Parent) ? map.get(p.Parent) : -1) : -1;
    p.Keys.forEach((k, slot) => {
      if (k.Kind === 'folder') {
        if (map.has(k.Target)) k.Target = map.get(k.Target);
        else p.Keys[slot] = blankKey();
      }
    });
  });
  page = 0;
  sel = -1;
  markDirty();
  renderAll();
}

$('addPage').onclick = () => {
  if (cfg.Pages.length >= 16) { toast('Tối đa 16 trang (kể cả thư mục)'); return; }
  cfg.Pages.push({Name: 'Trang ' + (topPages().length + 1), Parent: -1, Bar: 'info', Keys: Array.from({length: 8}, blankKey)});
  page = cfg.Pages.length - 1;
  sel = -1;
  markDirty();
  renderAll();
};

// ---------- màn hình xem trước ----------

async function renderScreen() {
  const screen = $('screen');
  const p = cfg.Pages[page];
  const token = (renderScreen.token = (renderScreen.token || 0) + 1);
  const keys = await Promise.all(p.Keys.map(async (k) => {
    if (k.Kind === 'empty' || k.Kind === 'back') return '';
    return preview(k.Icon, k.Title, k.Kind === 'folder');
  }));
  if (token !== renderScreen.token) return;
  screen.innerHTML = '';
  p.Keys.forEach((k, slot) => {
    const el = document.createElement('div');
    el.className = 'key' + (k.Kind === 'empty' ? ' empty' : '') + (slot === sel ? ' sel' : '');
    el.style.left = (10 + (slot % 4) * 117) + 'px';
    el.style.top = (9 + Math.floor(slot / 4) * 117) + 'px';
    if (k.Kind === 'back') {
      el.innerHTML = '<div class="back">&#xE76B;</div><div class="t" style="color:#9a9aa2">' + esc(k.Title || 'Quay ra') + '</div>';
    } else if (k.Kind !== 'empty') {
      el.innerHTML = (keys[slot] ? '<img alt="" src="' + keys[slot] + '">' : '') +
                     '<div class="t">' + esc(k.Live === 'volume' ? '62%' : k.Title) + '</div>';
    }
    el.onclick = () => { sel = slot; renderScreen(); renderEditor(); };
    el.draggable = true;
    el.ondragstart = (e) => { e.dataTransfer.setData('text/plain', String(slot)); };
    el.ondragover = (e) => { e.preventDefault(); el.classList.add('drop'); };
    el.ondragleave = () => el.classList.remove('drop');
    el.ondrop = (e) => {
      e.preventDefault();
      const from = parseInt(e.dataTransfer.getData('text/plain'), 10);
      if (isNaN(from) || from === slot) return;
      [p.Keys[from], p.Keys[slot]] = [p.Keys[slot], p.Keys[from]];
      sel = slot;
      markDirty();
      renderScreen();
      renderEditor();
    };
    screen.appendChild(el);
  });
  const folder = p.Parent >= 0;
  const tops = topPages();
  const dots = folder || tops.length < 2 ? '' :
      '<div class="dots">' + tops.map((i) => '<i class="' + (i === page ? 'on' : '') + '"></i>').join('') + '</div>';
  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.innerHTML = p.Bar === 'obs'
      ? '<span class="clock">12:04</span><div><div style="color:var(--text);font-weight:600">OBS · đang ghi</div><div>Cảnh: …</div></div><span class="spacer"></span><div style="text-align:right">Rớt 0<br>CPU 23%</div>'
      : '<span class="clock">' + new Date().toTimeString().slice(0, 5) + '</span><div><div style="color:var(--text);font-weight:600">' +
        esc(cfg.Name) + '</div><div>' + esc(folder ? 'Thư mục ' + p.Name : p.Name) + '</div></div><span class="spacer"></span>' +
        '<div style="text-align:right">CPU <span style="color:var(--green)">23%</span><br>RAM <span style="color:var(--accent)">41%</span></div>' + dots;
  screen.appendChild(bar);
}

// ---------- bảng sửa phím ----------

const KINDS = [['action', 'Lệnh'], ['toggle', 'Bật/tắt'], ['folder', 'Thư mục'], ['empty', 'Trống']];
const ACTIONS = [
  ['none', 'Không làm gì'], ['run', 'Chạy chương trình'], ['open', 'Mở web, file, thư mục'], ['hotkey', 'Phím tắt'],
  ['text', 'Gõ một đoạn chữ'], ['media', 'Nhạc (phát, bài sau…)'], ['volume', 'Âm lượng loa'], ['mic', 'Tắt/bật mic'],
  ['lock', 'Khoá máy'],
];
const SWATCHES = ['#2B2C33', '#1B1C22', '#012456', '#7A1212', '#B3261E', '#2E7D4F', '#1A9E4B', '#0E6E8C', '#3B4BC8', '#4A3A8C', '#8A4B00', '#C2185B'];
const PS = '%SystemRoot%\\System32\\WindowsPowerShell\\v1.0\\powershell.exe';
const CMD = '%SystemRoot%\\System32\\cmd.exe';
const PRESETS = [
  ['PowerShell', PS, false, 'E756', '#012456'], ['PowerShell admin', PS, true, 'E756', '#7A1212'],
  ['CMD', CMD, false, 'E756', '#1B1C22'], ['CMD admin', CMD, true, 'E756', '#7A1212'],
  ['Windows Terminal', 'wt.exe', false, 'E756', '#2B2C33'],
];

function seg(options, value, onPick) {
  const wrap = document.createElement('div');
  wrap.className = 'seg';
  options.forEach(([v, label]) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.className = v === value ? 'on' : '';
    b.onclick = () => onPick(v);
    wrap.appendChild(b);
  });
  return wrap;
}

function field(label, el) {
  const frag = document.createDocumentFragment();
  const l = document.createElement('label');
  l.className = 'field';
  l.textContent = label;
  frag.appendChild(l);
  frag.appendChild(el);
  return frag;
}

function input(value, onInput, attrs) {
  const el = document.createElement('input');
  el.value = value ?? '';
  Object.assign(el, attrs || {});
  el.oninput = () => { onInput(el.value); markDirty(); };
  return el;
}

let screenTimer = 0;
function changed() {
  markDirty();
  clearTimeout(screenTimer);
  screenTimer = setTimeout(renderScreen, 250);
}

function iconEditor(icon, title, onSwitchType) {
  const box = document.createElement('div');
  box.appendChild(seg([['glyph', 'Biểu tượng'], ['app', 'Icon app'], ['image', 'Ảnh'], ['none', 'Không']], icon.Type, (t) => {
    icon.Type = t;
    changed();
    onSwitchType();
  }));
  if (icon.Type === 'glyph') {
    const search = input('', () => {}, {placeholder: 'Tìm: mic, loa, khoá, terminal…'});
    search.style.marginTop = '8px';
    const grid = document.createElement('div');
    grid.className = 'glyphs';
    const fill = () => {
      const q = search.value.trim().toLowerCase();
      grid.innerHTML = '';
      glyphs.filter((g) => !q || g.name.includes(q)).forEach((g) => {
        const b = document.createElement('button');
        b.textContent = glyphChar(g.code);
        b.title = g.name;
        b.className = g.code === icon.Glyph ? 'on' : '';
        b.onclick = () => { icon.Glyph = g.code; changed(); fill(); };
        grid.appendChild(b);
      });
    };
    search.oninput = fill;
    fill();
    box.appendChild(search);
    box.appendChild(grid);
  } else if (icon.Type === 'app') {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.marginTop = '8px';
    const path = input(icon.Path, (v) => { icon.Path = v; changed(); }, {placeholder: 'C:\\...\\app.exe'});
    path.className = 'grow';
    const pick = document.createElement('button');
    pick.textContent = 'Chọn…';
    pick.onclick = async () => {
      const r = await api('/api/pick', {Kind: 'exe'});
      if (r.path) { icon.Path = r.path; path.value = r.path; changed(); }
    };
    row.appendChild(path);
    row.appendChild(pick);
    box.appendChild(row);
    box.appendChild(Object.assign(document.createElement('div'), {className: 'note', textContent: 'Lấy icon của file .exe, .lnk hay thư mục, như Explorer.'}));
  } else if (icon.Type === 'image') {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.marginTop = '8px';
    const file = document.createElement('input');
    file.type = 'file';
    file.accept = 'image/*';
    file.style.display = 'none';
    file.onchange = () => {
      const f = file.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const r = await api('/api/upload', {Name: f.name, Data: String(reader.result).split(',')[1]});
          icon.Path = r.file;
          changed();
          renderEditor();
        } catch (e) { toast(e.message); }
      };
      reader.readAsDataURL(f);
    };
    const up = document.createElement('button');
    up.textContent = icon.Path ? 'Đổi ảnh…' : 'Tải ảnh lên…';
    up.onclick = () => file.click();
    row.appendChild(up);
    row.appendChild(Object.assign(document.createElement('span'), {className: 'mini', textContent: icon.Path || 'Ảnh phủ kín phím, như Elgato'}));
    box.appendChild(row);
    box.appendChild(file);
  }
  if (icon.Type !== 'none') {
    const colors = document.createElement('div');
    colors.className = 'row';
    colors.style.marginTop = '10px';
    const bg = document.createElement('input');
    bg.type = 'color';
    bg.value = icon.Bg || '#2B2C33';
    bg.oninput = () => { icon.Bg = bg.value.toUpperCase(); changed(); };
    const sw = document.createElement('div');
    sw.className = 'swatches grow';
    SWATCHES.forEach((c) => {
      const b = document.createElement('button');
      b.style.background = c;
      b.title = c;
      b.onclick = () => { icon.Bg = c; bg.value = c; changed(); };
      sw.appendChild(b);
    });
    colors.appendChild(Object.assign(document.createElement('span'), {className: 'mini', textContent: 'Nền'}));
    colors.appendChild(bg);
    colors.appendChild(sw);
    if (icon.Type === 'glyph') {
      const fg = document.createElement('input');
      fg.type = 'color';
      fg.value = icon.Fg || '#FFFFFF';
      fg.title = 'Màu biểu tượng';
      fg.oninput = () => { icon.Fg = fg.value.toUpperCase(); changed(); };
      colors.appendChild(Object.assign(document.createElement('span'), {className: 'mini', textContent: 'Icon'}));
      colors.appendChild(fg);
    }
    box.appendChild(colors);
  }
  return box;
}

function actionEditor(action, key, isHold) {
  const box = document.createElement('div');
  const type = document.createElement('select');
  ACTIONS.forEach(([v, label]) => type.appendChild(new Option(label, v)));
  type.value = action.Type || 'none';
  type.onchange = () => { action.Type = type.value; markDirty(); renderEditor(); };
  box.appendChild(type);

  if (action.Type === 'run') {
    const presets = document.createElement('div');
    presets.className = 'presets';
    PRESETS.forEach(([label, path, admin, glyph, bg]) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.onclick = () => {
        Object.assign(action, {Path: path, Args: '', Dir: '', Admin: admin});
        if (!isHold) {
          if (!key.Title || PRESETS.some((p) => p[0] === key.Title)) key.Title = label.replace('Windows ', '');
          if (key.Icon.Type === 'none' || key.Icon.Type === 'glyph') Object.assign(key.Icon, {Type: 'glyph', Glyph: glyph, Bg: bg, Fg: '#FFFFFF'});
        }
        changed();
        renderEditor();
      };
      presets.appendChild(b);
    });
    box.appendChild(presets);
    const row = document.createElement('div');
    row.className = 'row';
    const path = input(action.Path, (v) => { action.Path = v; }, {placeholder: 'C:\\...\\chuong-trinh.exe'});
    path.className = 'grow';
    const pick = document.createElement('button');
    pick.textContent = 'Chọn…';
    pick.onclick = async () => {
      const r = await api('/api/pick', {Kind: 'exe'});
      if (!r.path) return;
      action.Path = r.path;
      path.value = r.path;
      if (!isHold && key.Icon.Type === 'none') Object.assign(key.Icon, {Type: 'app', Path: r.path, Bg: '#1B1C22'});
      if (!isHold && !key.Title) key.Title = r.path.split('\\').pop().replace(/\.[^.]+$/, '').slice(0, 20);
      changed();
      renderEditor();
    };
    row.appendChild(path);
    row.appendChild(pick);
    box.appendChild(field('Chương trình', row));
    box.appendChild(field('Tham số', input(action.Args, (v) => { action.Args = v; }, {placeholder: 'ví dụ: -NoExit -Command "cd D:\\du-an"'})));
    box.appendChild(field('Thư mục làm việc', input(action.Dir, (v) => { action.Dir = v; }, {placeholder: 'để trống: mặc định'})));
    const admin = document.createElement('label');
    admin.className = 'check';
    admin.innerHTML = '<input type="checkbox"' + (action.Admin ? ' checked' : '') + '><span>Chạy bằng quyền admin</span>';
    admin.querySelector('input').onchange = (e) => { action.Admin = e.target.checked; markDirty(); renderEditor(); };
    box.appendChild(admin);
    if (action.Admin) {
      box.appendChild(Object.assign(document.createElement('div'), {
        className: 'note warn',
        textContent: 'Khi lưu, Windows hỏi UAC một lần để đăng ký lệnh này vào Task Scheduler (thư mục CydDeck). Sau đó bấm phím là chạy quyền admin ngay, không hỏi nữa: ai chạm vào bảng cũng mở được.',
      }));
    }
  } else if (action.Type === 'open') {
    box.appendChild(field('Địa chỉ', input(action.Target, (v) => { action.Target = v; }, {placeholder: 'https://… , D:\\thu-muc , ms-settings:sound'})));
  } else if (action.Type === 'hotkey') {
    const keys = input(action.Keys, (v) => { action.Keys = v; }, {placeholder: 'Bấm tổ hợp phím vào đây'});
    keys.onkeydown = (e) => {
      e.preventDefault();
      const parts = [];
      if (e.ctrlKey) parts.push('Ctrl');
      if (e.shiftKey) parts.push('Shift');
      if (e.altKey) parts.push('Alt');
      if (e.metaKey) parts.push('Win');
      const k = e.key;
      if (!['Control', 'Shift', 'Alt', 'Meta', 'OS'].includes(k)) {
        const names = {' ': 'Space', 'ArrowUp': 'Up', 'ArrowDown': 'Down', 'ArrowLeft': 'Left', 'ArrowRight': 'Right',
                       'Escape': 'Esc', 'PageUp': 'PageUp', 'PageDown': 'PageDown'};
        parts.push(names[k] || (k.length === 1 ? k.toUpperCase() : k));
      }
      keys.value = parts.join('+');
      action.Keys = keys.value;
      markDirty();
    };
    box.appendChild(field('Tổ hợp phím', keys));
    box.appendChild(Object.assign(document.createElement('div'), {className: 'note', textContent: 'Phím Win thì gõ tay, ví dụ Win+Shift+S (trình duyệt không bắt được phím Win).'}));
  } else if (action.Type === 'text') {
    const area = document.createElement('textarea');
    area.rows = 3;
    area.value = action.Text || '';
    area.oninput = () => { action.Text = area.value; markDirty(); };
    box.appendChild(field('Đoạn chữ', area));
  } else if (action.Type === 'media' || action.Type === 'volume') {
    const opts = action.Type === 'media'
        ? [['playpause', 'Phát/dừng'], ['next', 'Bài sau'], ['prev', 'Bài trước'], ['stop', 'Dừng']]
        : [['up', 'To lên'], ['down', 'Nhỏ lại'], ['mute', 'Tắt tiếng']];
    if (!opts.some((o) => o[0] === action.Cmd)) action.Cmd = opts[0][0];
    box.appendChild(field('Việc', seg(opts, action.Cmd, (v) => { action.Cmd = v; markDirty(); renderEditor(); })));
  }
  if (!isHold && key.Kind === 'toggle' && !(action.Type === 'mic' || (action.Type === 'volume' && action.Cmd === 'mute'))) {
    box.appendChild(Object.assign(document.createElement('div'), {className: 'note warn',
      textContent: 'Phím bật/tắt chỉ biết trạng thái thật với lệnh "Tắt/bật mic" và "Âm lượng loa → Tắt tiếng".'}));
  }
  if (action.Type !== 'none') {
    const test = document.createElement('button');
    test.textContent = 'Thử lệnh ngay';
    test.style.marginTop = '10px';
    test.onclick = async () => {
      try {
        const r = await api('/api/test', {Key: key, Hold: isHold});
        toast(r.message);
      } catch (e) { toast(e.message); }
    };
    box.appendChild(test);
  }
  return box;
}

function folderEditor(key) {
  const box = document.createElement('div');
  const select = document.createElement('select');
  const folders = cfg.Pages.map((p, i) => i).filter((i) => cfg.Pages[i].Parent === page);
  folders.forEach((i) => select.appendChild(new Option(cfg.Pages[i].Name, String(i))));
  select.appendChild(new Option('+ Tạo thư mục mới', 'new'));
  select.value = folders.includes(key.Target) ? String(key.Target) : 'new';
  const apply = () => {
    if (select.value === 'new') {
      if (cfg.Pages.length >= 16) { toast('Tối đa 16 trang (kể cả thư mục)'); return; }
      const keys = Array.from({length: 8}, blankKey);
      keys[0] = Object.assign(blankKey(), {Kind: 'back', Title: 'Quay ra'});
      cfg.Pages.push({Name: key.Title || 'Thư mục', Parent: page, Bar: 'info', Keys: keys});
      key.Target = cfg.Pages.length - 1;
    } else {
      key.Target = parseInt(select.value, 10);
    }
    changed();
    renderPages();
    renderEditor();
  };
  select.onchange = apply;
  if (!folders.includes(key.Target)) apply();
  box.appendChild(field('Mở thư mục', select));
  const open = document.createElement('button');
  open.textContent = 'Sửa phím trong thư mục';
  open.style.marginTop = '8px';
  open.onclick = () => { page = key.Target; sel = -1; renderAll(); };
  box.appendChild(open);
  return box;
}

function renderEditor() {
  const ed = $('editor');
  ed.innerHTML = '';
  if (sel < 0) {
    ed.innerHTML = '<div class="empty-editor">Chọn một phím để sửa</div>';
    return;
  }
  const p = cfg.Pages[page];
  const key = p.Keys[sel];
  const head = document.createElement('div');
  head.className = 'row';
  head.innerHTML = '<b class="grow">Phím ' + (sel + 1) + '</b>';
  const clear = document.createElement('button');
  clear.className = 'ghost';
  clear.textContent = 'Xoá phím';
  clear.onclick = () => { p.Keys[sel] = blankKey(); changed(); renderEditor(); };
  head.appendChild(clear);
  ed.appendChild(head);

  const kinds = KINDS.slice();
  if (p.Parent >= 0) kinds.push(['back', 'Quay ra']);
  ed.appendChild(field('Loại phím', seg(kinds, key.Kind, (v) => {
    key.Kind = v;
    if (v === 'toggle' && !key.IconOn) {
      key.IconOn = Object.assign(blankIcon(), key.Icon, {Bg: '#B3261E'});
    }
    if (v !== 'empty' && v !== 'back' && key.Icon.Type === 'none') Object.assign(key.Icon, {Type: 'glyph', Glyph: v === 'folder' ? 'E8B7' : 'E700'});
    changed();
    renderEditor();
  })));
  if (key.Kind === 'empty' || key.Kind === 'back') {
    if (key.Kind === 'back') ed.appendChild(field('Nhãn', input(key.Title, (v) => { key.Title = v; changed(); }, {maxLength: 20})));
    return;
  }
  ed.appendChild(field('Nhãn', input(key.Title, (v) => { key.Title = v; changed(); }, {maxLength: 20, placeholder: 'ngắn, ~10 chữ cái thì vừa phím'})));
  if (key.Kind === 'toggle') {
    ed.appendChild(field('Nhãn khi bật', input(key.TitleOn, (v) => { key.TitleOn = v; changed(); }, {maxLength: 20, placeholder: 'ví dụ: Mic tắt'})));
  }

  const iconBox = document.createElement('div');
  iconBox.className = 'box';
  iconBox.innerHTML = '<div class="head"><b>' + (key.Kind === 'toggle' ? 'Icon khi tắt' : 'Icon') + '</b></div>';
  iconBox.appendChild(iconEditor(key.Icon, key.Title, renderEditor));
  ed.appendChild(iconBox);
  if (key.Kind === 'toggle') {
    if (!key.IconOn) key.IconOn = blankIcon();
    const onBox = document.createElement('div');
    onBox.className = 'box';
    onBox.innerHTML = '<div class="head"><b>Icon khi bật</b></div>';
    onBox.appendChild(iconEditor(key.IconOn, key.TitleOn || key.Title, renderEditor));
    ed.appendChild(onBox);
  }

  if (key.Kind === 'folder') {
    ed.appendChild(folderEditor(key));
    return;
  }

  const actionBox = document.createElement('div');
  actionBox.className = 'box';
  actionBox.innerHTML = '<div class="head"><b>Lệnh khi chạm</b></div>';
  actionBox.appendChild(actionEditor(key.Action, key, false));
  ed.appendChild(actionBox);

  const holdBox = document.createElement('div');
  holdBox.className = 'box';
  holdBox.innerHTML = '<div class="head"><b>Lệnh khi giữ 0,5 giây</b><span class="mini">không có: chạy lệnh khi chạm</span></div>';
  holdBox.appendChild(actionEditor(key.Hold, key, true));
  ed.appendChild(holdBox);

  const live = document.createElement('label');
  live.className = 'check';
  live.innerHTML = '<input type="checkbox"' + (key.Live === 'volume' ? ' checked' : '') + '><span>Nhãn hiện âm lượng loa (ví dụ 62%)</span>';
  live.querySelector('input').onchange = (e) => { key.Live = e.target.checked ? 'volume' : ''; changed(); };
  ed.appendChild(live);
}

function renderAll() {
  $('profileName').value = cfg.Name;
  renderPages();
  renderScreen();
  renderEditor();
}

$('profileName').oninput = (e) => { cfg.Name = e.target.value; changed(); };

// Lưới phím tự thu nhỏ khi cửa sổ hẹp
function fitDevice() {
  const center = document.querySelector('.center');
  const z = Math.max(0.45, Math.min(1, (center.clientWidth - 40) / 500));
  document.querySelector('.device').style.setProperty('--z', z.toFixed(3));
}
window.addEventListener('resize', fitDevice);
fitDevice();

$('save').onclick = async () => {
  if (saving) return;
  saving = true;
  $('save').disabled = true;
  $('save').textContent = 'Đang lưu…';
  try {
    const r = await api('/api/config', cfg, 'PUT');
    cfg = r.config;
    cfg.Pages.forEach((p) => p.Keys.forEach(fix));
    if (page >= cfg.Pages.length) page = 0;
    dirty = false;
    $('dirty').textContent = '';
    toast(r.message);
    renderAll();
  } catch (e) {
    toast('Không lưu được: ' + e.message);
  } finally {
    saving = false;
    $('save').disabled = false;
    $('save').textContent = 'Lưu và gửi xuống bo';
  }
};

$('openFolder').onclick = () => api('/api/open-folder', {}).catch((e) => toast(e.message));

window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

load().catch((e) => {
  document.body.innerHTML = '<p style="padding:24px">Không đọc được dữ liệu từ CydAgent: ' + esc(e.message) +
      '. Mở lại cửa sổ này từ menu "Cài đặt Deck…" ở icon CydAgent trên khay.</p>';
});
</script>
