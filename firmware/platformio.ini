; =============================================================================
;  CYD Deck: Stream Deck trên ESP32-2432S028R ("Cheap Yellow Display") + LVGL 9.5
;
;  8 phím ảnh màu + thanh tin, nối PC qua cáp USB (CydAgent). Không có Wi-Fi.
;  Phần lõi (màn hình, cảm ứng, hiệu ứng) chép từ ..\CYD-EEZ.
;
;  Lệnh nhanh (đứng ở thư mục này):  .\cyd.cmd   hoặc   .\cyd.cmd shot
; =============================================================================

[platformio]
default_envs = cyd

[env]
platform = platformio/espressif32@8.0.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv   ; chương trình 1,5 MB + kho ảnh phím ~2,4 MB
board_build.f_flash = 80000000L            ; flash 80 MHz: mã LVGL, font và ảnh phím đọc từ flash qua cache
board_build.flash_mode = qio

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600                      ; cyd.cmd tự thử lại 115200 nếu nạp lỗi

lib_deps =
    lvgl/lvgl@9.5.0
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

extra_scripts = pre:tools/pio_hooks.py

build_flags =
    ; platform espressif32 8.0.0 không tự thêm cờ -O nào: thiếu -O2 thì GCC dịch ở -O0 (vẽ chậm 5–10 lần)
    -O2
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    ; --- TFT_eSPI: chân màn hình CYD (bus HSPI) ---
    -DUSER_SETUP_LOADED
    -DUSE_HSPI_PORT
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DDISABLE_ALL_LIBRARY_WARNINGS
    ; Lật màn 180° mặc định; bo nhớ lựa chọn trong NVS (cùng khoá với CYD-EEZ)
    -DCYD_FLIP_DEFAULT=1

[env:cyd]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER

[env:cyd2usb]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF
